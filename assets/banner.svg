<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 48px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #e2e8f0;
      letter-spacing: 1px;
    }
    .tagline {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .pulse-circle {
      animation: pulse 4s infinite alternate ease-in-out;
    }
    .floating-grid {
      animation: float 6s infinite alternate ease-in-out;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.2; }
      100% { transform: scale(1.15); opacity: 0.4; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-15px); }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="16" />

  <!-- Dynamic Geometric Elements (Background) -->
  <g class="pulse-circle" transform-origin="1000 150">
    <circle cx="1000" cy="150" r="180" fill="none" stroke="url(#textGrad)" stroke-width="1.5" stroke-dasharray="10 15" opacity="0.3" />
    <circle cx="1000" cy="150" r="120" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.2" />
  </g>

  <g class="floating-grid" opacity="0.15">
    <path d="M 50,20 L 350,20 M 50,60 L 350,60 M 50,100 L 350,100 M 50,140 L 350,140" stroke="#38bdf8" stroke-width="1" />
    <path d="M 100,0 L 100,160 M 180,0 L 180,160 M 260,0 L 260,160" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Decorative Shapes (Behind Text) -->
  <circle cx="950" cy="80" r="6" fill="#38bdf8" opacity="0.8" />
  <circle cx="1080" cy="220" r="8" fill="#c084fc" opacity="0.8" />
  <circle cx="850" cy="230" r="4" fill="#818cf8" opacity="0.6" />
  <polygon points="1020,70 1035,95 1005,95" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5" />

  <!-- Foreground Content Layer -->
  <g transform="translate(80, 110)">
    <!-- Category Badge Tagline -->
    <text x="0" y="0" class="tagline">✨ Curated Ecosystem Directory</text>
    
    <!-- Main Title -->
    <text x="0" y="52" class="title" filter="url(#glow)">Awesome Nonprofit Grant Management</text>
    
    <!-- Subtitle -->
    <text x="0" y="96" class="subtitle">Top Open-Source Projects &amp; Commercial SaaS Platforms for Grantmakers &amp; Nonprofits</text>
  </g>
  
  <!-- Subtle Border Highlight -->
  <rect width="1196" height="296" x="2" y="2" fill="none" stroke="url(#textGrad)" stroke-width="1" rx="15" opacity="0.4" />
</svg>
